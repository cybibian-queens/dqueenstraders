kind = "web"
previewPath = "/bot-forge/"
title = "DQueens Traders Bot Forge"
version = "1.0.0"
id = "artifacts/bot-forge"
router = "path"

[[services]]
name = "web"
paths = [ "/bot-forge/" ]
localPort = 21727

[services.development]
run = "pnpm --filter @workspace/bot-forge run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bot-forge", "run", "build" ]
serve = "static"
publicDir = "artifacts/bot-forge/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21727"
BASE_PATH = "/bot-forge/"
