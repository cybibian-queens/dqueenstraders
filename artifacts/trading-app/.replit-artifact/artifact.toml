kind = "web"
previewPath = "/"
title = "Deriv Digits Trading App"
version = "1.0.0"
id = "artifacts/trading-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20013

[services.development]
run = "pnpm --filter @workspace/trading-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/trading-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/trading-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20013"
BASE_PATH = "/"
